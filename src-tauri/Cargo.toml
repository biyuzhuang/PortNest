[package]
name = "portnest"
version = "0.1.0"
description = "一站式开发运维中枢"
authors = ["PortNest Team"]
edition = "2021"

[lib]
name = "portnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Protocol: SSH/SFTP
ssh2 = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "sqlite"] }
mysql_async = "0.34"

# Local storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Async trait
async-trait = "0.1"

# UUID & ID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Encryption
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
base64 = "0.22"

# Error handling
thiserror = "1"
anyhow = "1"

# Async channels
flume = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Asyncfs for async file operations
async-io = "2"

# SSH key parsing
pem = "3"

# System directories
dirs = "6"

# Thread-safe parking lot
parking_lot = "0.12"

# SHA2 for hashing
sha2 = "0.10"

# HTTP client for AI
reqwest = { version = "0.12", features = ["json"] }

